<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mission Control</title>
  <style>
    :root {
      color-scheme:dark;
      --bg:#0d0f13; --panel:#15181e; --panel-2:#1b1f27; --line:#2a303a;
      --text:#f4f6f8; --muted:#939dab; --active:#52e0b7; --warn:#ffca67;
      --error:#ff7185; --quiet:#758194; --accent:#8aa8ff;
    }
    * { box-sizing:border-box }
    body { min-height:100vh; margin:0; background:radial-gradient(circle at 70% -15%,#24304f55,transparent 34%),var(--bg); color:var(--text); font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
    button { font:inherit }
    .appbar { position:sticky; top:0; z-index:5; border-bottom:1px solid #242933cc; background:#0d0f13e8; backdrop-filter:blur(16px) }
    .appbar-inner { display:flex; align-items:center; justify-content:space-between; max-width:1440px; margin:auto; padding:13px 16px }
    .brand { display:flex; align-items:center; gap:10px }
    .mark { display:grid; place-items:center; width:29px; height:29px; border:1px solid #52617d; border-radius:9px; background:linear-gradient(145deg,#27334c,#161a22); color:#bcd0ff; font-weight:800 }
    h1 { margin:0; font-size:15px; letter-spacing:.025em }
    .eyebrow { color:var(--muted); font-size:9px; letter-spacing:.16em; text-transform:uppercase }
    .live { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:10px; letter-spacing:.08em }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--quiet); box-shadow:0 0 0 4px #75819418 }
    .live[data-state="live"] .dot { background:var(--active); box-shadow:0 0 0 4px #52e0b71a; animation:pulse 1.8s infinite }
    .live[data-state="offline"] .dot { background:var(--error) }
    .workspace { display:grid; gap:12px; max-width:1440px; margin:auto; padding:12px }
    .pane { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#12151aee; box-shadow:0 16px 44px #0003 }
    .pane-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 15px 12px }
    h2 { margin:0; font-size:14px }
    .subtle { margin-top:2px; color:var(--muted); font-size:10px }
    .task-actions { display:flex; align-items:center; gap:6px }
    .count, .plan { padding:3px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:#171b22; font-size:10px; white-space:nowrap }
    .bulk-toggle { padding:3px 8px; border:1px solid #3c4864; border-radius:999px; color:#bdcaff; background:#252e431f; font-size:10px; white-space:nowrap; cursor:pointer }
    .plan { color:#bdcaff; border-color:#3c4864; background:#252e431f }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0 12px 11px }
    .stat { padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--panel-2) }
    .stat b { display:block; font-size:17px; line-height:1.05 }
    .stat span { color:var(--muted); font-size:9px }
    nav { display:flex; gap:5px; padding:0 12px 10px }
    nav button { flex:1; padding:7px 8px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:transparent; cursor:pointer }
    nav button[aria-pressed="true"] { color:var(--text); background:#272c35; border-color:#404853 }
    nav button:focus-visible, .task-select:focus-visible, .bulk-toggle:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
    .tools { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; padding:0 12px 10px }
    .tools input, .tools select { min-width:0; height:32px; border:1px solid var(--line); border-radius:9px; color:var(--text); background:#11151b; font:10px system-ui,-apple-system,"Segoe UI",sans-serif }
    .tools input { width:100%; padding:0 10px }
    .tools select { padding:0 25px 0 9px }
    .tools input::placeholder { color:#707a88 }
    .notice { display:flex; justify-content:space-between; gap:10px; padding:0 14px 9px; color:var(--muted); font-size:10px }
    #tasks { padding:0 10px 10px }
    article { margin-bottom:7px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:0 5px 18px #0002; transition:border-color .15s,background .15s }
    article[data-task-card] { cursor:pointer }
    article.selected { border-color:#657baa; background:#1a202b }
    article.active { border-left-color:var(--active) }
    article.systemError { border-left-color:var(--error) }
    .task-head { display:flex; align-items:flex-start; gap:8px }
    .task-select { min-width:0; flex:1; padding:0; border:0; color:inherit; background:none; text-align:left; cursor:pointer }
    .task-title { display:block; font-weight:650; overflow-wrap:anywhere }
    .pill { flex:none; padding:2px 7px; border-radius:999px; color:var(--quiet); background:#75819418; font-size:9px }
    .pill.active { color:var(--active); background:#52e0b718 }
    .pill.systemError { color:var(--error); background:#ff718518 }
    .pill.idle { color:var(--warn); background:#ffca6715 }
    .meta { display:flex; flex-wrap:wrap; gap:4px 9px; margin-top:6px; color:var(--muted); font-size:9px }
    .specs { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px }
    .spec { padding:2px 6px; border:1px solid #343c49; border-radius:6px; color:#c6cfdd; background:#11151b; font:9px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace }
    .spec-label { margin-right:5px; color:#778499; font:700 7px/1 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.08em }
    .spec.unknown { color:#77808d }
    .activity-line { display:none; height:3px; margin-top:8px; overflow:hidden; border-radius:3px; background:#292f38 }
    .activity-line i { display:block; width:35%; height:100%; border-radius:inherit; background:var(--quiet) }
    .active > .activity-line, .systemError > .activity-line { display:block }
    .active > .activity-line i { background:linear-gradient(90deg,transparent,var(--active),transparent); animation:run 1.4s linear infinite }
    .systemError > .activity-line i { width:100%; background:var(--error) }
    .children { margin:9px 0 0 7px; padding-left:8px; border-left:2px solid #303744 }
    .children summary { margin:0 0 7px; color:var(--muted); cursor:pointer; font-size:9px; list-style-position:inside }
    .children article { margin-bottom:6px; padding:8px 9px; background:#101318 }
    article.compact { padding:8px 10px }
    article.compact > .task-head .meta, article.compact > .task-head .specs, article.compact > .activity-line, article.compact > .children article { display:none }
    article.compact > .children { margin-top:4px }
    article.compact > .children summary { margin:0 }
    .agent .task-title::before { content:"↳ "; color:var(--active) }
    .empty { padding:42px 12px; text-align:center; color:var(--muted) }
    .status-body { display:grid; gap:10px; padding:0 12px 12px }
    .status-screen { display:grid; gap:10px }
    [hidden] { display:none!important }
    .status-card { padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2) }
    .status-card h3 { margin:0; font-size:11px; letter-spacing:.02em }
    .status-title { margin:5px 0 0; font-weight:650; overflow-wrap:anywhere }
    code { display:block; margin-top:6px; overflow:hidden; color:#aeb8c7; font:9px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace; text-overflow:ellipsis; white-space:nowrap }
    .usage-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:11px }
    .usage-row strong { font-size:18px }
    .usage-row span, .reset, .unavailable { color:var(--muted); font-size:9px }
    progress { display:block; width:100%; height:7px; margin-top:7px; overflow:hidden; border:0; border-radius:999px; background:#2a303a }
    progress::-webkit-progress-bar { border-radius:999px; background:#2a303a }
    progress::-webkit-progress-value { border-radius:999px; background:linear-gradient(90deg,var(--active),#a7efd8) }
    progress::-moz-progress-bar { border-radius:999px; background:linear-gradient(90deg,var(--active),#a7efd8) }
    progress.warn::-webkit-progress-value { background:linear-gradient(90deg,var(--warn),#ff8f70) }
    progress.warn::-moz-progress-bar { background:linear-gradient(90deg,var(--warn),#ff8f70) }
    progress.danger::-webkit-progress-value { background:var(--error) }
    progress.danger::-moz-progress-bar { background:var(--error) }
    .limit + .limit { margin-top:15px; padding-top:13px; border-top:1px solid var(--line) }
    .reset { margin-top:5px }
    .activity-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-top:10px }
    .activity-stat { min-width:0; padding:9px; border-radius:9px; background:#111419 }
    .activity-stat b { display:block; overflow:hidden; font-size:14px; text-overflow:ellipsis; white-space:nowrap }
    .activity-stat span { color:var(--muted); font-size:8px }
    .status-note { color:var(--muted); font-size:9px; text-align:center }
    footer { padding:4px 14px 18px; color:#697383; font-size:9px; text-align:center }
    @keyframes run { from{transform:translateX(-110%)} to{transform:translateX(300%)} }
    @keyframes pulse { 50%{opacity:.45} }
    @media (min-width:720px) {
      .workspace { grid-template-columns:1fr }
      .status-pane { order:-1; display:grid; grid-template-columns:minmax(220px,300px) minmax(0,1fr); align-items:start }
      .status-pane > .pane-head { padding-bottom:8px }
      .status-pane > .status-nav { grid-column:1 }
      .status-pane > .status-body { grid-column:2; grid-row:1 / span 2; padding:12px }
      #detailsPanel { grid-template-columns:repeat(2,minmax(0,1fr)) }
      #tasks { columns:280px; column-gap:8px }
      #tasks > article { display:inline-block; width:100%; break-inside:avoid-column }
      #tasks > .empty { column-span:all }
    }
    @media (max-width:719px) { .status-pane { grid-row:1 } }
    @media (max-width:420px) { .workspace { padding:8px }.pane { border-radius:13px }.appbar-inner { padding:11px 12px } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; animation:none!important; transition:none!important } }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand"><div class="mark" aria-hidden="true">M</div><div><div class="eyebrow">Codex · v1.3.0</div><h1>Mission Control</h1></div></div>
      <div class="live" id="live" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="connection" aria-live="polite">接続中</span></div>
    </div>
  </header>
  <main class="workspace">
    <section class="pane tasks-pane" aria-labelledby="tasksTitle">
      <div class="pane-head"><div><h2 id="tasksTitle">タスク</h2><div class="subtle">親タスクと Agents をまとめて表示</div></div><div class="task-actions"><button class="bulk-toggle" id="toggleCards" type="button">すべて最小</button><span class="count" id="taskCount">0件</span></div></div>
      <div class="stats">
        <div class="stat"><b id="activeCount">–</b><span>実行中</span></div>
        <div class="stat"><b id="agentCount">–</b><span>Agents</span></div>
        <div class="stat"><b id="attentionCount">–</b><span>要確認</span></div>
      </div>
      <nav aria-label="表示フィルター">
        <button data-filter="all" aria-pressed="true">すべて</button>
        <button data-filter="focus" aria-pressed="false">進行中</button>
        <button data-filter="agents" aria-pressed="false">Agents</button>
      </nav>
      <div class="tools">
        <input id="taskSearch" type="search" aria-label="タスクを検索" placeholder="タスク・プロジェクト・モデルを検索">
        <select id="taskSort" aria-label="タスクの並び替え">
          <option value="priority">優先順</option>
          <option value="updated">更新順</option>
          <option value="project">プロジェクト順</option>
        </select>
      </div>
      <div class="notice"><span id="message">状態を取得しています</span><time id="updated">–</time></div>
      <div id="tasks" aria-label="タスク一覧"></div>
    </section>

    <aside class="pane status-pane" aria-labelledby="statusTitle">
      <div class="pane-head"><div><h2 id="statusTitle">使用状況</h2><div class="subtle">/status 相当のライブ情報</div></div><span class="plan" id="plan">確認中</span></div>
      <nav class="status-nav" aria-label="使用状況の画面">
        <button data-status-view="overview" aria-pressed="true">週上限</button>
        <button data-status-view="details" aria-pressed="false">詳細</button>
      </nav>
      <div class="status-body">
        <div class="status-screen" id="overviewPanel">
          <section class="status-card" aria-labelledby="limitsTitle"><h3 id="limitsTitle">Codex 週上限</h3><div id="limits"></div></section>
        </div>
        <div class="status-screen" id="detailsPanel" hidden>
          <section class="status-card" id="threadStatus" aria-labelledby="threadStatusTitle"></section>
          <section class="status-card" aria-labelledby="activityTitle"><h3 id="activityTitle">トークン活動</h3><div id="activity"></div></section>
        </div>
        <div class="status-note"><span id="usageMessage"></span> <time id="usageUpdated"></time></div>
      </div>
    </aside>
  </main>
  <footer>3秒ごとにタスク更新 · 使用状況は60秒ごと · ローカル接続のみ</footer>
  <script>
    const labels={active:"実行中",systemError:"要確認",idle:"待機中",notLoaded:"未読込",unknown:"不明"};
    const priority={active:0,systemError:1,idle:2,notLoaded:3,unknown:4};
    const numberFormat=new Intl.NumberFormat("ja-JP");
    const compactFormat=new Intl.NumberFormat("ja-JP",{notation:"compact",maximumFractionDigits:1});
    let saved={};try{saved=JSON.parse(localStorage.getItem("mission-control-ui")||"{}")||{}}catch{}
    let snapshot={threads:[],threadsReady:false,usage:{}}, filter=["all","focus","agents"].includes(saved.filter)?saved.filter:"all", statusView=["overview","details"].includes(saved.statusView)?saved.statusView:"overview", selectedId=saved.selectedId||null, query=typeof saved.query==="string"?saved.query:"", sortBy=["priority","updated","project"].includes(saved.sortBy)?saved.sortBy:"priority", collapsed=new Set(Array.isArray(saved.collapsed)?saved.collapsed:[]), compactCards=new Set(Array.isArray(saved.compactCards)?saved.compactCards:[]);
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const relative=time=>{const seconds=Math.max(0,Math.round((Date.now()-time)/1000));if(seconds<10)return"たった今";if(seconds<60)return`${seconds}秒前`;if(seconds<3600)return`${Math.floor(seconds/60)}分前`;if(seconds<86400)return`${Math.floor(seconds/3600)}時間前`;return`${Math.floor(seconds/86400)}日前`};
    const flag=flags=>flags?.includes("waitingOnApproval")?"承認待ち":flags?.includes("waitingOnUserInput")?"入力待ち":null;
    const formatTokens=value=>value==null?"–":compactFormat.format(value);
    const exact=value=>value==null?"":numberFormat.format(value);
    const percent=value=>Math.max(0,Math.min(100,Number(value)||0));
    const progressClass=value=>value>=90?"danger":value>=70?"warn":"";
    const remainingClass=value=>value<=10?"danger":value<=30?"warn":"";
    function saveUi(){try{localStorage.setItem("mission-control-ui",JSON.stringify({filter,statusView,selectedId,query,sortBy,collapsed:[...collapsed],compactCards:[...compactCards]}))}catch{}}
    function resetAt(time){if(!time)return"リセット時刻なし";const date=new Date(time);const remaining=time-Date.now();const left=remaining<=0?"まもなく":remaining<86400000?`あと${Math.ceil(remaining/3600000)}時間`:`あと${Math.ceil(remaining/86400000)}日`;return`リセット: ${date.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} · ${left}`}
    function family(thread,byParent){return [thread,...(byParent.get(thread.id)||[]).flatMap(child=>family(child,byParent))]}
    function rootTasks(threads){return threads.filter(thread=>!thread.parentId||!threads.some(item=>item.id===thread.parentId))}
    function contextSpec(thread){const used=thread.context?.usedTokens,total=thread.context?.contextWindow;if(used==null||!total)return"";const remaining=percent(100-used/total*100);return`<span class="spec" title="${exact(used)} / ${exact(total)} tokens 使用"><span class="spec-label">CTX</span>残り${Math.round(remaining)}%</span>`}
    function specs(thread){return `<span class="specs"><span class="spec ${thread.model?"":"unknown"}"><span class="spec-label">MODEL</span>${escapeHtml(thread.model||"不明")}</span><span class="spec ${thread.effort?"":"unknown"}"><span class="spec-label">EFFORT</span>${escapeHtml(thread.effort||"不明")}</span>${contextSpec(thread)}</span>`}
    function card(thread,byParent){const status=labels[thread.status]||labels.unknown;const note=flag(thread.activeFlags);const children=(byParent.get(thread.id)||[]).sort((a,b)=>a.updatedAt-b.updatedAt);const compact=!thread.isSubagent&&compactCards.has(thread.id);const activeAgents=children.filter(child=>child.status==="active").length;const attentionAgents=children.filter(child=>child.status==="systemError").length;const agentSummary=`${children.length} Agents${activeAgents?` · ${activeAgents}実行中`:""}${attentionAgents?` · ${attentionAgents}要確認`:""}`;return `<article class="${escapeHtml(thread.status)} ${thread.isSubagent?"agent":""} ${thread.id===selectedId?"selected":""} ${compact?"compact":""}"${thread.isSubagent?"":` data-task-card="${escapeHtml(thread.id)}"`}><div class="task-head"><button class="task-select" data-thread-id="${escapeHtml(thread.id)}" aria-pressed="${thread.id===selectedId}"${thread.isSubagent?"":` aria-expanded="${!compact}" title="${compact?"展開":"最小表示"}"`}><span class="task-title">${escapeHtml(thread.title)}</span><span class="meta"><span>${escapeHtml(thread.project)}</span><span>${relative(thread.updatedAt)}</span>${thread.isSubagent?`<span>${escapeHtml(thread.agentKind||"subagent")}</span>`:""}</span>${specs(thread)}</button><span class="pill ${escapeHtml(thread.status)}">${escapeHtml(note||status)}</span></div><div class="activity-line" aria-hidden="true"><i></i></div>${children.length?`<details class="children" data-thread-group="${escapeHtml(thread.id)}" ${collapsed.has(thread.id)?"":"open"}><summary>${agentSummary}</summary>${children.map(child=>card(child,byParent)).join("")}</details>`:""}</article>`}
    function renderTasks(){
      const threads=snapshot.threads||[];
      if(!threads.some(thread=>thread.id===selectedId))selectedId=threads.find(thread=>thread.status==="active"&&!thread.isSubagent)?.id||threads.find(thread=>thread.status==="active")?.id||threads[0]?.id||null;
      const byParent=new Map();
      for(const thread of threads){if(thread.parentId){const list=byParent.get(thread.parentId)||[];list.push(thread);byParent.set(thread.parentId,list)}}
      const roots=rootTasks(threads);
      const term=query.trim().toLocaleLowerCase("ja");
      const visible=root=>{const group=family(root,byParent);const matchesFilter=filter==="all"||filter==="agents"&&group.some(item=>item.isSubagent)||filter==="focus"&&group.some(item=>item.status==="active"||item.status==="systemError");const matchesSearch=!term||group.some(item=>[item.title,item.project,item.model,item.effort,item.agentKind].some(value=>String(value||"").toLocaleLowerCase("ja").includes(term)));return matchesFilter&&matchesSearch};
      const compare=(a,b)=>Number(b.isPinned)-Number(a.isPinned)||(sortBy==="updated"?b.updatedAt-a.updatedAt:sortBy==="project"?String(a.project).localeCompare(String(b.project),"ja")||b.updatedAt-a.updatedAt:(priority[a.status]??9)-(priority[b.status]??9)||b.updatedAt-a.updatedAt);
      const sorted=roots.filter(visible).sort(compare);
      document.querySelector("#tasks").innerHTML=sorted.length?sorted.map(root=>card(root,byParent)).join(""):`<div class="empty">${!snapshot.threadsReady?"タスクを読み込み中…":filter==="focus"?"現在、進行中のタスクはありません":"表示できるタスクがありません"}</div>`;
      document.querySelector("#taskCount").textContent=`${sorted.length}件 / 全${roots.length}件`;
      const allCompact=roots.length&&roots.every(root=>compactCards.has(root.id));document.querySelector("#toggleCards").textContent=allCompact?"すべて展開":"すべて最小";document.querySelector("#toggleCards").setAttribute("aria-pressed",String(Boolean(allCompact)));
      document.querySelector("#activeCount").textContent=threads.filter(thread=>thread.status==="active").length;
      document.querySelector("#agentCount").textContent=threads.filter(thread=>thread.isSubagent&&thread.status==="active").length;
      document.querySelector("#attentionCount").textContent=threads.filter(thread=>thread.status==="systemError").length;
    }
    function renderThreadStatus(){
      const thread=(snapshot.threads||[]).find(item=>item.id===selectedId);
      if(!thread){document.querySelector("#threadStatus").innerHTML='<h3 id="threadStatusTitle">選択タスク</h3><div class="unavailable">タスクを取得すると詳細を表示します</div>';return}
      const context=thread.context;
      const used=context?.usedTokens||0;
      const total=context?.contextWindow||0;
      const ratio=total?used/total*100:0;
      document.querySelector("#threadStatus").innerHTML=`<h3 id="threadStatusTitle">選択タスク</h3><div class="status-title">${escapeHtml(thread.title)}</div>${specs(thread)}<code title="${escapeHtml(thread.id)}">${escapeHtml(thread.id)}</code>${context?`<div class="usage-row"><div><strong>${Math.round(ratio)}%</strong> <span>コンテキスト使用</span></div><span title="${exact(used)} / ${exact(total)} tokens">${formatTokens(used)} / ${formatTokens(total)}</span></div><progress class="${progressClass(ratio)}" max="100" value="${percent(ratio)}" aria-label="コンテキスト使用率 ${Math.round(ratio)}%"></progress>`:'<div class="unavailable" style="margin-top:10px">このタスクのコンテキスト情報はまだありません</div>'}`;
    }
    function renderLimits(){
      const usage=snapshot.usage||{};
      const limit=(usage.limits||[]).find(item=>item.id==="codex");
      const windows=(limit?.windows||[]).filter(window=>window.windowDurationMins>=10080);
      document.querySelector("#plan").textContent=usage.plan?String(usage.plan).toUpperCase():usage.status==="loading"?"確認中":"未取得";
      document.querySelector("#limits").innerHTML=windows.length?windows.map(window=>{const remaining=percent(100-window.usedPercent);return`<div class="limit"><div class="usage-row"><strong>残り${Math.round(remaining)}%</strong><span>${resetAt(window.resetsAt)}</span></div><progress class="${remainingClass(remaining)}" max="100" value="${remaining}" aria-label="Codex 週上限 残り ${Math.round(remaining)}%"></progress></div>`}).join(""):'<div class="unavailable" style="margin-top:10px">週上限を取得できません</div>';
    }
    function renderActivity(){
      const activity=snapshot.usage?.activity;
      if(!activity){document.querySelector("#activity").innerHTML='<div class="unavailable" style="margin-top:10px">この認証方式では利用できない場合があります</div>';return}
      const cells=[
        [formatTokens(activity.latest?.tokens),activity.latest?.date?`${activity.latest.date} の利用`:"最新日の利用",activity.latest?.tokens],
        [formatTokens(activity.lifetimeTokens),"累計トークン",activity.lifetimeTokens],
        [formatTokens(activity.peakDailyTokens),"1日の最大",activity.peakDailyTokens],
        [activity.currentStreakDays==null?"–":`${activity.currentStreakDays}日`,"現在の連続利用",null],
      ];
      document.querySelector("#activity").innerHTML=`<div class="activity-grid">${cells.map(([value,label,raw])=>`<div class="activity-stat"${raw!=null?` title="${exact(raw)} tokens"`:""}><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`).join("")}</div>`;
    }
    function render(){
      renderTasks();renderThreadStatus();renderLimits();renderActivity();
      document.querySelector("#message").textContent=snapshot.message||"";
      document.querySelector("#updated").textContent=snapshot.updatedAt?relative(snapshot.updatedAt):"–";
      document.querySelector("#live").dataset.state=snapshot.connection;
      document.querySelector("#connection").textContent=snapshot.connection==="live"?"LIVE":snapshot.connection==="offline"?"OFFLINE":"接続中";
      document.querySelector("#usageMessage").textContent=snapshot.usage?.message||"";
      document.querySelector("#usageUpdated").textContent=snapshot.usage?.updatedAt?`更新 ${relative(snapshot.usage.updatedAt)}`:"";
    }
    document.querySelector("#taskSearch").value=query;document.querySelector("#taskSort").value=sortBy;
    document.querySelectorAll("[data-filter]").forEach(button=>{button.setAttribute("aria-pressed",String(button.dataset.filter===filter));button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));saveUi();render()})});
    document.querySelectorAll("[data-status-view]").forEach(button=>{button.setAttribute("aria-pressed",String(button.dataset.statusView===statusView));button.addEventListener("click",()=>{statusView=button.dataset.statusView;document.querySelectorAll("[data-status-view]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));document.querySelector("#overviewPanel").hidden=statusView!=="overview";document.querySelector("#detailsPanel").hidden=statusView!=="details";saveUi()})});
    document.querySelector("#overviewPanel").hidden=statusView!=="overview";document.querySelector("#detailsPanel").hidden=statusView!=="details";
    document.querySelector("#taskSearch").addEventListener("input",event=>{query=event.target.value;saveUi();render()});
    document.querySelector("#taskSearch").addEventListener("keydown",event=>{if(event.key==="Escape"&&query){query="";event.currentTarget.value="";saveUi();render()}});
    document.querySelector("#taskSort").addEventListener("change",event=>{sortBy=event.target.value;saveUi();render()});
    document.querySelector("#toggleCards").addEventListener("click",()=>{const roots=rootTasks(snapshot.threads||[]);const allCompact=roots.length&&roots.every(root=>compactCards.has(root.id));for(const root of roots)allCompact?compactCards.delete(root.id):compactCards.add(root.id);saveUi();render()});
    document.querySelector("#tasks").addEventListener("click",event=>{const button=event.target.closest(".task-select");const article=event.target.closest("[data-task-card]");let changed=false;if(button){selectedId=button.dataset.threadId;changed=true}if(article&&!event.target.closest(".children")){selectedId=article.dataset.taskCard;compactCards.has(selectedId)?compactCards.delete(selectedId):compactCards.add(selectedId);changed=true}if(changed){saveUi();render()}});
    document.querySelector("#tasks").addEventListener("toggle",event=>{const details=event.target.closest("details[data-thread-group]");if(!details)return;details.open?collapsed.delete(details.dataset.threadGroup):collapsed.add(details.dataset.threadGroup);saveUi()},true);
    document.addEventListener("keydown",event=>{if(event.key==="/"&&!event.ctrlKey&&!event.metaKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)){event.preventDefault();document.querySelector("#taskSearch").focus()}});
    const events=new EventSource("/events");
    events.onmessage=event=>{snapshot=JSON.parse(event.data);render()};
    events.onerror=()=>{snapshot.connection="offline";snapshot.message="再接続しています";render()};
    render();
  </script>
</body>
</html>
